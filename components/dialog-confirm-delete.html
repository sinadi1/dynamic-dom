<dialog id="delete-dialog" role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-desc">
  <div class="dialog-header">
    <h2 id="delete-title">Remove this user?</h2>
  </div>
  <div class="dialog-body">
    <p id="delete-desc">This user will lose access immediately. This action cannot be undone.</p>
  </div>
  <div class="dialog-footer">
    <button type="button" class="btn btn-secondary" data-close-dialog autofocus>Cancel</button>
    <button type="button" class="btn btn-danger" data-close-dialog>Remove user</button>
  </div>
</dialog>
